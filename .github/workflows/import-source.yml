name: Import project source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download audited source archive
        run: curl --fail --location --retry 3 https://conoce-tu-contraparte-latam.vercel.app/source-repo.zip --output /tmp/source-repo.zip

      - name: Import project files
        run: unzip -o /tmp/source-repo.zip -d .

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish redesigned investigation experience"
            git push
          fi

# Source sync requested after the investigation-center redesign.
